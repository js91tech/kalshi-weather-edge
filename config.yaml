# Default mode: paper | live (UI can override; live still needs API keys + confirm)
mode: paper

# Signal style: model_edge (weather ensemble) | favorites (high hit-rate consensus)
strategy: favorites

favorites:
  yes_threshold: 0.90
  no_threshold: 0.10
  contracts: 1.0
  # Series to scan for favorite signals
  series:
    - KXAAAGASD
    - KXEURUSD
    - KXNASDAQDUD
    - KXHIGHNY
    - KXHIGHCHI
    - KXHIGHLAX
    - KXHIGHMIA
    - KXHIGHDEN
    - KXHIGHAUS

kalshi:
  base_url: https://external-api.kalshi.com/trade-api/v2
  demo_base_url: https://external-api.demo.kalshi.co/trade-api/v2
  # Taker fee ≈ 0.07 * p * (1-p) dollars per contract (peak at p=0.5)
  taker_fee_rate: 0.07
  maker_fee_rate: 0.0
  # Live safety caps
  live_max_contracts_per_order: 5
  live_require_maker: true

edge:
  # Minimum edge after fees (probability points, e.g. 0.04 = 4pp)
  min_edge: 0.04
  # Prefer posting as maker; taker only if edge clears this higher bar
  min_edge_taker: 0.08
  # Longshot fade: market YES below this and model much lower → fade YES (sell/buy NO)
  longshot_market_max: 0.12
  longshot_overprice_min: 0.03
  # Shrink raw model_p toward market mid until CLI calibration exists (0=trust model, 1=trust market)
  market_shrinkage: 0.35
  # Keep at most this many non-PASS signals per city+date (by |edge|)
  max_trades_per_event: 2
  # Fractional Kelly for paper size suggestion (bankroll units)
  kelly_fraction: 0.25
  max_contracts_per_signal: 25
  paper_bankroll: 1000.0

forecast:
  # Open-Meteo: free, no key; ensemble quantiles for μ/σ
  provider: open_meteo
  # Wider floors: grid/ensemble ≠ NWS CLI settlement station
  sigma_floor: 1.5
  sigma_scale: 1.35
  # Continuity correction for integer CLI settlement (°F)
  continuity_correction: 0.5

backtest:
  lookback_days: 220
  # Max settled markets to score per city (API pages) — ~6 brackets/day * ~70 days ≈ 420
  max_markets_per_city: 500
  # Use candle mid this many hours before market close as entry proxy
  entry_hours_before_close: 18
  contracts_per_trade: 1.0
  # Fine-tune grids
  tune_min_edge: [0.02, 0.04, 0.06, 0.08]
  tune_shrinkage: [0.2, 0.35, 0.5, 0.65]
  tune_longshot_overprice: [0.02, 0.03, 0.05]

