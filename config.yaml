# Kalshi Favorites — paper/live high hit-rate scanner
mode: paper
strategy: favorites

favorites:
  yes_threshold: 0.90
  no_threshold: 0.10
  contracts: 1.0
  series:
    - KXAAAGASD   # AAA gas prices
    - KXEURUSD    # EUR/USD thresholds
    - KXNASDAQDUD # Nasdaq above/below
    - KXCPINDEX   # CPI index
    - KXUSNFP     # Nonfarm payrolls

# Looser NO band for higher $/contract (backtested separately from favorites)
high_profit:
  yes_threshold: 0.90
  no_threshold: 0.30
  contracts: 1.0
  series:
    - KXEURUSD
    - KXAAAGASD
    - KXNASDAQDUD
    - KXCPINDEX
    - KXUSNFP

kalshi:
  base_url: https://external-api.kalshi.com/trade-api/v2
  demo_base_url: https://external-api.demo.kalshi.co/trade-api/v2
  taker_fee_rate: 0.07
  maker_fee_rate: 0.0
  live_max_contracts_per_order: 5
  live_require_maker: true

backtest:
  lookback_days: 220
  max_markets_per_series: 500
  entry_hours_before_close: 12
  contracts_per_trade: 1.0

paths:
  data_dir: data
  db_path: data/ledger.db
