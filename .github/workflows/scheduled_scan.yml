name: Scheduled Kalshi Scan

on:
  schedule:
    # Every 30 minutes
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      strategy:
        description: "Strategy to scan"
        required: true
        default: both
        type: choice
        options:
          - both
          - favorites
          - high_profit

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scheduled scan
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          PYTHONPATH: src
        run: |
          python scripts/scheduled_scan.py --strategy ${{ github.event.inputs.strategy || 'both' }}

      - name: Upload scan artifact
        uses: actions/upload-artifact@v4
        with:
          name: kalshi-scan
          path: |
            data/scans/latest.json
            data/scans/scan_*.json
            data/ledger_snapshot.json
          if-no-files-found: warn
          retention-days: 14

      - name: Commit ledger snapshot for Streamlit Cloud
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ledger_snapshot.json data/scans/latest.json || true
          git diff --staged --quiet || git commit -m "chore: update ledger snapshot from scheduled scan"
          git push || true
