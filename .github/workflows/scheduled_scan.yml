name: Scheduled Kalshi Scan

on:
  schedule:
    # Every 30 minutes
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      strategy:
        description: "Strategy to scan"
        required: true
        default: both
        type: choice
        options:
          - both
          - favorites
          - high_profit

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scheduled scan
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          PYTHONPATH: src
        run: |
          python scripts/scheduled_scan.py --strategy ${{ github.event.inputs.strategy || 'both' }}

      - name: Upload scan artifact
        uses: actions/upload-artifact@v4
        with:
          name: kalshi-scan
          path: |
            data/scans/latest.json
            data/scans/scan_*.json
          if-no-files-found: warn
          retention-days: 14
